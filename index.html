<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRITICAL ERROR</title>
    <style>
        body { 
            background-color: black; 
            color: #ff0000; 
            font-family: 'Courier New', Courier, monospace; 
            font-size: 1.2rem; 
            padding: 20px; 
            overflow: hidden; 
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        #console { white-space: pre-wrap; margin-top: 20px; flex-grow: 1;}
        #start-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        #start-btn {
            color: #00ff00;
            font-size: 1.2rem;
            text-align: center;
            border: 1px solid #00ff00;
            padding: 15px 30px;
            cursor: pointer;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="start-screen" onclick="startHack()">
        <div id="start-btn">[ INITIALIZE SYSTEM DIAGNOSTIC ]</div>
    </div>
    
    <div id="console"></div>

    <script>
        function startHack() {
            // تفعيل الشاشة الكاملة
            document.documentElement.requestFullscreen().catch((e) => {});
            document.getElementById('start-screen').style.display = 'none';
            
            let cons = document.getElementById('console');
            
            let cmds = [
                "CONNECTION ESTABLISHED...",
                "BYPASSING SECURITY PROTOCOLS... [OK]",
                "ROOT ACCESS: GRANTED",
                "LOCATING INTERNAL STORAGE...",
                "EXTRACTING MEDIA FILES... 24%",
                "EXTRACTING MEDIA FILES... 68%",
                "EXTRACTING MEDIA FILES... 100%",
                "UPLOADING TO REMOTE SERVER...",
                "UPLOAD COMPLETE.",
                "INITIATING DEVICE WIPE...",
                "ERASING BOOTLOADER...",
                "WARNING: SYSTEM CORRUPTION IMMINENT.",
                "5...",
                "4...",
                "3...",
                "2...",
                "1..."
            ];
            
            let i = 0;
            let interval = setInterval(() => {
                if(i < cmds.length) {
                    cons.innerHTML += cmds[i] + "<br><br>";
                    window.scrollTo(0, document.body.scrollHeight);
                    i++;
                } else {
                    clearInterval(interval);
                    cons.innerHTML += "<span style='color:red; font-size:2.5rem; display:block; text-align:center; margin-top:30px; animation: blink 0.5s infinite;'>FATAL ERROR: OS NOT FOUND</span>";
                }
            }, 1000); 
        }
    </script>
</body>
</html>
