<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRITICAL ERROR</title>
    <style>
        body { 
            background-color: black; 
            color: red; /* لون أحمر صريح */
            font-family: 'Courier New', Courier, monospace; 
            font-size: 11px; /* خط صغير جداً عشان يبين إنه كلام واجد */
            padding: 5px; 
            overflow: hidden; 
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        #console { 
            white-space: pre-wrap; 
            word-wrap: break-word; 
            flex-grow: 1; 
            overflow-y: hidden; /* نخفي شريط التمرير عشان يعطي جو واقعي */
        }
    </style>
</head>
<body>
    
    <div id="console"></div>

    <script>
        let cons = document.getElementById('console');
        
        // مصطلحات هبد تقني عشان تملي الشاشة
        let prefixes = ["[SYSTEM]", "[KERNEL]", "[ROOT]", "[EXPLOIT]", "[DATA]", "[NETWORK]", "[PAYLOAD]"];
        let actions = ["DUMPING MEMORY", "EXTRACTING KEYLOG", "BYPASSING FIREWALL", "DECRYPTING HASH", "INJECTING SCRIPT", "DOWNLOADING DCIM", "WIPING SECTOR", "CLONING IMEI"];
        
        // دالة توليد هبد وأرقام عشوائية
        function generateGibberish() {
            let text = "";
            for(let i=0; i<6; i++) {
                text += Math.random().toString(36).substr(2, 6).toUpperCase() + " ";
            }
            return text;
        }

        // يبدأ يطبع الكود اول ما يفتح الرابط بدون ما يضغط شيء
        window.onload = function() {
            let interval = setInterval(() => {
                let pre = prefixes[Math.floor(Math.random() * prefixes.length)];
                let act = actions[Math.floor(Math.random() * actions.length)];
                let hex = generateGibberish();
                
                // إضافة سطر جديد للشاشة
                let newLine = `${pre} ${act} at 0x${hex} ... SUCCESS\n`;
                cons.innerHTML += newLine;
                
                // يخلي الشاشة تنزل تحت تلقائي مع الكلام
                cons.scrollTop = cons.scrollHeight;

                // عشان المتصفح ما يعلق ونخرب الخدعة، بنمسح الكلام القديم إذا صار واجد
                if (cons.innerHTML.length > 5000) {
                    cons.innerHTML = cons.innerHTML.substring(2000);
                }

            }, 40); // سرعة صاروخية (كل 40 جزء من الثانية سطر جديد)
        }
    </script>
</body>
</html>
